name: ParkTracker
options:
  bundleIdPrefix: com.example
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    # Set your Apple ID team here (Xcode > Settings > Accounts) to run on a device:
    # DEVELOPMENT_TEAM: ABCDE12345

targets:
  ParkTracker:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ParkTracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.parktracker
        INFOPLIST_FILE: ParkTracker/App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
        CODE_SIGN_STYLE: Automatic
